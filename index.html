<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>寶寶的時間表 ⏰</title>
<style>
  :root {
    --bg1: #FFE5B4;
    --bg2: #FFD1DC;
    --bg3: #B5EAD7;
    --card: #FFFFFF;
    --ink: #2D3047;
    --accent: #FF6B6B;
    --gold: #FFC93C;
    --blue: #4ECDC4;
    --pink: #FF6B9D;
    --purple: #A06CD5;
    --green: #95E06C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    background-attachment: fixed;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 1.2vh;
    height: 100vh;
    padding: 1.2vh 1.5vw;
  }

  /* ───── Weekday strip ───── */
  .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.8vw;
  }

  .day {
    background: var(--card);
    border-radius: 18px;
    padding: 1.2vh 0.5vw;
    text-align: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.3vh;
    transition: transform 0.3s ease;
  }

  .day .emoji { font-size: clamp(20px, 3.2vw, 42px); line-height: 1; }
  .day .label { font-size: clamp(13px, 1.6vw, 22px); font-weight: 800; }

  .day.active {
    background: linear-gradient(135deg, var(--gold), var(--accent));
    color: white;
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 8px 0 rgba(255,107,107,0.4), 0 0 0 4px rgba(255,255,255,0.9) inset;
    animation: bounce 1.4s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(-4px) scale(1.05); }
    50%      { transform: translateY(-10px) scale(1.08); }
  }

  /* ───── Main split ───── */
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5vw;
    min-height: 0;
  }

  .panel {
    background: var(--card);
    border-radius: 32px;
    padding: 2vh 1.5vw;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }

  .panel-title {
    position: absolute;
    top: 1.4vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(14px, 1.5vw, 22px);
    font-weight: 800;
    color: var(--purple);
    letter-spacing: 2px;
  }

  /* ───── Digital clock (left) ───── */
  .digital {
    background: linear-gradient(135deg, #FFF5E1, #FFE5B4);
  }

  .digital-time {
    font-family: "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(60px, 13vw, 200px);
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 6px 0 rgba(255,107,107,0.25);
    letter-spacing: -2px;
    display: flex;
    align-items: baseline;
    gap: 0.05em;
  }

  .digital-time .colon {
    color: var(--gold);
    animation: blink 1s steps(2) infinite;
  }

  @keyframes blink {
    50% { opacity: 0.2; }
  }

  .digital-seconds {
    font-size: clamp(24px, 4.5vw, 64px);
    color: var(--blue);
    font-weight: 800;
    margin-top: 1vh;
  }

  .ampm {
    font-size: clamp(28px, 5vw, 72px);
    background: var(--gold);
    color: white;
    padding: 0.3vh 1.5vw;
    border-radius: 20px;
    margin-top: 1.5vh;
    font-weight: 900;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }

  .chime-btn {
    margin-top: 2vh;
    font-family: inherit;
    font-size: clamp(20px, 2.6vw, 36px);
    font-weight: 900;
    color: white;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border: none;
    padding: 1.4vh 3vw;
    border-radius: 999px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.18);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.6vw;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .chime-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.18);
  }
  .chime-btn.ringing {
    animation: ring 0.4s ease-in-out 3;
  }
  @keyframes ring {
    0%, 100% { transform: rotate(0); }
    25%      { transform: rotate(-10deg); }
    75%      { transform: rotate(10deg); }
  }

  /* ───── Analog clock (right) ───── */
  .analog {
    background: linear-gradient(135deg, #E0F7FA, #B5EAD7);
  }

  .clock-wrap {
    position: relative;
    width: min(85%, 60vh);
    aspect-ratio: 1;
  }

  .clock-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .face { fill: #fff; stroke: var(--ink); stroke-width: 4; }
  .tick { stroke: var(--ink); stroke-linecap: round; }
  .tick.major { stroke-width: 5; }
  .tick.minor { stroke-width: 2; opacity: 0.5; }
  .num { font-weight: 900; font-size: 22px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }

  .hand { stroke-linecap: round; transform-origin: 250px 250px; transition: transform 0.4s cubic-bezier(0.4, 2.5, 0.6, 1); }
  .hand-hour { stroke: var(--ink); stroke-width: 14; }
  .hand-min  { stroke: var(--accent); stroke-width: 9; }
  .hand-sec  { stroke: var(--gold); stroke-width: 3; }
  .pivot { fill: var(--gold); stroke: var(--ink); stroke-width: 3; }

  .activity {
    transform-origin: 250px 250px;
  }
  .activity-bg {
    fill: var(--card);
    stroke-width: 3;
  }
  .activity-emoji {
    font-size: 36px;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .activity-label {
    font-size: 18px;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: central;
    fill: var(--ink);
  }

  .activity.now .activity-bg {
    animation: pulse 1s ease-in-out infinite;
    stroke-width: 6;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  /* ───── Current activity banner ───── */
  .now-banner {
    position: absolute;
    bottom: 1.4vh;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--accent), var(--pink));
    color: white;
    padding: 1vh 2vw;
    border-radius: 20px;
    font-size: clamp(16px, 2vw, 28px);
    font-weight: 800;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    display: none;
    align-items: center;
    gap: 0.6vw;
    white-space: nowrap;
  }
  .now-banner.show { display: flex; animation: pop 0.6s ease; }
  @keyframes pop {
    0% { transform: translateX(-50%) scale(0.4); opacity: 0; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }

  /* ───── Portrait / phone ───── */
  @media (orientation: portrait) {
    .app { grid-template-rows: auto auto 1fr; }
    .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .digital { padding: 3vh 4vw; }
    .digital-time { font-size: clamp(56px, 18vw, 160px); }
    .clock-wrap { width: min(90%, 70vw); }
    .day .label { font-size: clamp(11px, 2.6vw, 18px); }
    .day .emoji { font-size: clamp(18px, 5vw, 32px); }
    .day { padding: 0.8vh 0.3vw; border-radius: 14px; }
  }

  @media (max-width: 480px) {
    .panel-title { font-size: 13px; }
    .ampm { font-size: 32px; padding: 4px 16px; }
    .digital-seconds { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Weekday strip -->
  <div class="week" id="week"></div>

  <!-- Main split -->
  <div class="main">

    <!-- Left: digital clock -->
    <div class="panel digital">
      <div class="panel-title">數字時鐘</div>
      <div class="digital-time">
        <span id="d-h">00</span><span class="colon">:</span><span id="d-m">00</span>
      </div>
      <div class="digital-seconds" id="d-s">00 秒</div>
      <div class="ampm" id="d-ampm">上午</div>
      <button class="chime-btn" id="chime-btn" aria-label="報時">
        <span>🔔</span><span>報時</span>
      </button>
    </div>

    <!-- Right: analog clock -->
    <div class="panel analog">
      <div class="panel-title">錶盤時鐘</div>
      <div class="clock-wrap">
        <svg class="clock-svg" viewBox="0 0 500 500" id="clock"></svg>
      </div>
      <div class="now-banner" id="banner"></div>
    </div>

  </div>
</div>

<script>
/* ───────── Data ───────── */
const DAYS = [
  { label: '星期日', emoji: '☀️' },
  { label: '星期一', emoji: '🌱' },
  { label: '星期二', emoji: '🐰' },
  { label: '星期三', emoji: '🌈' },
  { label: '星期四', emoji: '🦋' },
  { label: '星期五', emoji: '🎈' },
  { label: '星期六', emoji: '⭐' },
];

const ACTIVITIES = [
  { h: 7,  m: 30, emoji: '🎒', label: '上學',  color: '#4ECDC4', period: 'am' },
  { h: 18, m: 30, emoji: '🍚', label: '吃飯',  color: '#FF6B9D', period: 'pm' },
  { h: 20, m: 0,  emoji: '🛁', label: '洗澡',  color: '#A06CD5', period: 'pm' },
  { h: 20, m: 30, emoji: '😴', label: '睡覺',  color: '#95E06C', period: 'pm' },
];

/* ───────── Build weekday strip ───────── */
const weekEl = document.getElementById('week');
DAYS.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'day';
  el.dataset.idx = i;
  el.innerHTML = `<div class="emoji">${d.emoji}</div><div class="label">${d.label}</div>`;
  weekEl.appendChild(el);
});

/* ───────── Build analog clock SVG ───────── */
const clock = document.getElementById('clock');
const CX = 250, CY = 250, R = 230;

const svgNS = 'http://www.w3.org/2000/svg';
function el(name, attrs = {}, text) {
  const e = document.createElementNS(svgNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}

// Face
clock.appendChild(el('circle', { class: 'face', cx: CX, cy: CY, r: R, fill: '#FFFEF7' }));

// Ticks & numbers
for (let i = 0; i < 60; i++) {
  const angle = (i * 6 - 90) * Math.PI / 180;
  const isMajor = i % 5 === 0;
  const r1 = isMajor ? R - 22 : R - 12;
  const r2 = R - 4;
  clock.appendChild(el('line', {
    class: 'tick ' + (isMajor ? 'major' : 'minor'),
    x1: CX + r1 * Math.cos(angle),
    y1: CY + r1 * Math.sin(angle),
    x2: CX + r2 * Math.cos(angle),
    y2: CY + r2 * Math.sin(angle),
  }));
}
for (let h = 1; h <= 12; h++) {
  const angle = (h * 30 - 90) * Math.PI / 180;
  const rN = R - 48;
  clock.appendChild(el('text', {
    class: 'num',
    x: CX + rN * Math.cos(angle),
    y: CY + rN * Math.sin(angle),
  }, h));
}

// Activities placed around the dial
ACTIVITIES.forEach((a, i) => {
  const hour12 = a.h % 12;
  const totalMin = hour12 * 60 + a.m;        // minutes from 12 on a 12-h dial
  const deg = totalMin / 720 * 360 - 90;     // 720 min = full circle
  const angle = deg * Math.PI / 180;
  const rA = R + 50;
  const x = CX + rA * Math.cos(angle);
  const y = CY + rA * Math.sin(angle);

  const g = el('g', { class: 'activity', id: 'act-' + i });
  g.appendChild(el('circle', {
    class: 'activity-bg',
    cx: x, cy: y, r: 42,
    stroke: a.color,
  }));
  g.appendChild(el('text', {
    class: 'activity-emoji',
    x: x, y: y - 6,
  }, a.emoji));
  g.appendChild(el('text', {
    class: 'activity-label',
    x: x, y: y + 24,
    fill: a.color,
  }, a.label));
  // Time label
  const timeStr = String(a.h).padStart(2,'0') + ':' + String(a.m).padStart(2,'0');
  g.appendChild(el('text', {
    x: x, y: y + 42,
    'text-anchor': 'middle',
    'dominant-baseline': 'central',
    'font-size': 13,
    'font-weight': 700,
    fill: '#666',
  }, timeStr));
  clock.appendChild(g);
});

// Hands (drawn last → on top)
const handHour = el('line', { class: 'hand hand-hour', x1: CX, y1: CY, x2: CX, y2: CY - 110 });
const handMin  = el('line', { class: 'hand hand-min',  x1: CX, y1: CY, x2: CX, y2: CY - 160 });
const handSec  = el('line', { class: 'hand hand-sec',  x1: CX, y1: CY, x2: CX, y2: CY - 180 });
clock.appendChild(handHour);
clock.appendChild(handMin);
clock.appendChild(handSec);
clock.appendChild(el('circle', { class: 'pivot', cx: CX, cy: CY, r: 10 }));

/* ───────── Tick loop ───────── */
const dH = document.getElementById('d-h');
const dM = document.getElementById('d-m');
const dS = document.getElementById('d-s');
const dAm = document.getElementById('d-ampm');
const banner = document.getElementById('banner');
const days = document.querySelectorAll('.day');

function pad(n) { return String(n).padStart(2, '0'); }

function update() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  // Digital
  const h12 = ((h + 11) % 12) + 1;
  dH.textContent = pad(h12);
  dM.textContent = pad(m);
  dS.textContent = pad(s) + ' 秒';
  dAm.textContent = h < 12 ? '上午' : '下午';

  // Analog hands (smooth)
  const secAng = s * 6;
  const minAng = m * 6 + s * 0.1;
  const hrAng  = (h % 12) * 30 + m * 0.5;
  handSec.style.transform = `rotate(${secAng}deg)`;
  handMin.style.transform = `rotate(${minAng}deg)`;
  handHour.style.transform = `rotate(${hrAng}deg)`;

  // Highlight today
  const today = now.getDay();
  days.forEach(d => d.classList.toggle('active', +d.dataset.idx === today));

  // AM window: 00:01–12:00 ; PM window: 12:01–24:00 (00:00 shown as AM)
  const totalMin = h * 60 + m;
  const isAM = totalMin <= 720;          // ≤ 12:00 counts as morning
  const period = isAM ? 'am' : 'pm';

  // Highlight active activity (within ±15 min window) — only show period-matched
  const nowMin = totalMin;
  let currentAct = null;
  ACTIVITIES.forEach((a, i) => {
    const node = document.getElementById('act-' + i);
    const inPeriod = a.period === period;
    node.style.display = inPeriod ? '' : 'none';
    if (!inPeriod) { node.classList.remove('now'); return; }
    const actMin = a.h * 60 + a.m;
    const diff = Math.abs(nowMin - actMin);
    const isNow = diff <= 15;
    node.classList.toggle('now', isNow);
    if (isNow) currentAct = a;
  });

  if (currentAct) {
    banner.innerHTML = `<span style="font-size:1.3em">${currentAct.emoji}</span> 現在是 ${currentAct.label} 時間！`;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

update();
setInterval(update, 1000);

/* ───────── Chime + speak ───────── */
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Pleasant ding-dong (two notes: G5 → E5)
function ding(freq, when, dur = 0.9) {
  const ctx = getAudio();
  if (!ctx) return;
  const t = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  // Add a soft second harmonic for warmth
  const osc2 = ctx.createOscillator();
  const gain2 = ctx.createGain();
  osc2.type = 'triangle';
  osc2.frequency.value = freq * 2;
  gain2.gain.setValueAtTime(0, t);
  gain2.gain.linearRampToValueAtTime(0.08, t + 0.01);
  gain2.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.4, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(ctx.destination);
  osc2.connect(gain2).connect(ctx.destination);
  osc.start(t); osc.stop(t + dur);
  osc2.start(t); osc2.stop(t + dur);
}

function chimeBell() {
  ding(784, 0);      // G5
  ding(659, 0.45);   // E5
}

function speakTime() {
  if (!('speechSynthesis' in window)) return;
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const period = h < 12 ? '早上' : (h < 18 ? '下午' : '晚上');
  const h12 = ((h + 11) % 12) + 1;
  const text = m === 0
    ? `現在是${period}${h12}點`
    : `現在是${period}${h12}點${m}分`;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  u.rate = 0.85;
  u.pitch = 1.2;
  // Prefer a Chinese voice if available
  const voices = speechSynthesis.getVoices();
  const zh = voices.find(v => /zh[-_]TW/i.test(v.lang))
          || voices.find(v => /zh/i.test(v.lang));
  if (zh) u.voice = zh;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function announce() {
  chimeBell();
  setTimeout(speakTime, 1100);
  const btn = document.getElementById('chime-btn');
  btn.classList.add('ringing');
  setTimeout(() => btn.classList.remove('ringing'), 1300);
}

document.getElementById('chime-btn').addEventListener('click', announce);

// Auto-chime on the hour (minute 0, seconds 0)
let lastChimedHour = -1;
setInterval(() => {
  const now = new Date();
  if (now.getMinutes() === 0 && now.getSeconds() === 0 && now.getHours() !== lastChimedHour) {
    lastChimedHour = now.getHours();
    announce();
  }
}, 1000);

// Some browsers load voices async — nudge load
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => {};
  speechSynthesis.getVoices();
}

// Prevent iOS bounce / accidental zoom
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
</script>
</body>
</html>
